<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>


    <form action="" id="form">
        <div>
            <label for="username">Name : </label>
            <input type="text" id="username" placeholder="Enter your username">
    <span class="error-message" style="color: red;"></span>
        </div>
        <div>
            <label for="email">Email : </label>
            <input type="email" id="email" placeholder="Enter your Email">
              <span class="error-message" style="color: red;"></span>
        </div>
        <div>
            <label for="Password">Password : </label>
            <input type="password" id="password" placeholder="Enter your password">
              <span class="error-message" style="color: red;"></span>
        </div>

        <p id="passwordHint" class="hidden" >Must be at least 8 characters</p>

        <div>
            <label for="bio">Bio : </label>
            <textarea name="bio" id="bio" placeholder="Enter your bio..."></textarea>
            <p id="charCount"></p>
              <span class="error-message" style="color: red;"></span>
        </div>
        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox">I agree to the terms and conditions.</label>
        </div>
        <div>
            <label for="country">Select your country</label>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
            </select>
              <span class="error-message" style="color: red;"></span>
        </div>


        <button id="btn" type="submit">Login</button>
    </form>


    <h1 class="hidden">Account Created Succesfully🎇</h1>


    <script src="index.js"></script>
</body>

</html>
